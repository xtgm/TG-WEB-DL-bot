name = "tc044"
main = "worker.js"
compatibility_date = "2026-07-08"

# Cron triggers. 用来推进群发任务：每分钟发一批 40 人，没有进行中的任务时 handler 直接返回。
# Cloudflare 只支持 5 段式 cron，不支持带秒的 6 段写法，所以最细粒度就是每分钟。
[triggers]
crons = ["* * * * *"]

# D1 绑定。database_id 不写进配置文件：这是账号内部的资源标识，公开仓库里不放任何账号信息。
# 构建时由环境变量 D1_DATABASE_ID 注入替换，变量在 Dashboard「设置 → 构建」里配置并勾选加密。
# 构建命令：sed -i "s|REPLACE_WITH_D1_DATABASE_ID|$D1_DATABASE_ID|" wrangler.toml && npx wrangler deploy
[[d1_databases]]
binding = "DB"
database_name = "tg-dualbot-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# 这里刻意不写 [vars]。PUBLIC_BASE_URL、TURNSTILE_SITE_KEY、ADMIN_CHAT_IDS 等变量
# 全部在 Cloudflare Dashboard 的「设置 → 变量和机密」里维护。
# wrangler deploy 会用配置文件里的值覆盖 Dashboard 上的同名变量，写进来就会把线上配置清空。
