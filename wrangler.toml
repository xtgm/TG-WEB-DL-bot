name = "tc044"
main = "worker.js"
compatibility_date = "2026-07-08"

# keep_vars 必须为 true。wrangler deploy 默认会用配置文件覆盖云端变量，配置里没有的会被删除；
# 没有这一行，Dashboard 上的 PUBLIC_BASE_URL、TURNSTILE_SITE_KEY、ADMIN_CHAT_IDS 等会被清空。
keep_vars = true

# Cron triggers. 用来推进群发任务：每分钟发一批 40 人，没有进行中的任务时 handler 直接返回。
# Cloudflare 只支持 5 段式 cron，不支持带秒的 6 段写法，所以最细粒度就是每分钟。
[triggers]
crons = ["* * * * *"]

# D1 绑定。database_id 直接写死在这里：
# 之前靠 Dashboard 构建命令里的 sed 从环境变量注入，一旦那条命令丢了（2026-10-16 就丢过一次），
# 占位符原样带到部署请求，报 10021 构建失败。写死之后部署只依赖本文件，链路不再有第二个环节。
# database_id 只是资源编号，拿到也调不了任何 API（真正的凭据不在这里），所以明文放着。
[[d1_databases]]
binding = "DB"
database_name = "tg-dualbot-db"
database_id = "fce83635-4b57-4d04-bf5e-8392007f7446"

# 这里刻意不写 [vars]。PUBLIC_BASE_URL、TURNSTILE_SITE_KEY、ADMIN_CHAT_IDS 等变量
# 全部在 Cloudflare Dashboard 的「设置 → 变量和机密」里维护。
# wrangler deploy 会用配置文件里的值覆盖 Dashboard 上的同名变量，写进来就会把线上配置清空。
